<!DOCTYPE html>
<html>
<head>
  <title>For You</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to bottom right, #ffd6e8, #ffeef5, #fff0f8);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      position: relative;
    }

    /* 🌸 Glow Side Containers */
    .glow-container {
      position: fixed;
      top: 0;
      width: 160px;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .glow-container.left { left: 0; }
    .glow-container.right { right: 0; }

    .dot {
      position: absolute;
      bottom: -20px;
      border-radius: 50%;
      background: rgba(255, 182, 193, 0.7);
      box-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
      animation: floatDot linear forwards;
    }

    @keyframes floatDot {
      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    /* Card */
    #mainContent {
      background: white;
      padding: 50px;
      border-radius: 30px;
      max-width: 550px;
      width: 90%;
      text-align: center;
      position: relative;
      z-index: 2;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.15),
        0 0 40px rgba(214, 51, 132, 0.15);

      animation: fadeInUp 1.2s ease forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 44px;
      color: #d63384;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      color: #444;
    }

    #secret {
      opacity: 0;
      transition: opacity 0.6s ease;
      margin-top: 15px;
    }

    button {
      background: linear-gradient(45deg, hotpink, deeppink);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(255,105,180,0.3);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(255,105,180,0.4);
    }

    #nextPageButton {
      display: inline-block;
      background: linear-gradient(45deg, hotpink, deeppink);
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(255,105,180,0.3);
    }

    #nextPageButton:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(255,105,180,0.4);
    }

    #memoryPhoto {
      display: block;
      margin: 25px auto;
      width: 260px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      transition: transform 0.4s ease;
    }

    #memoryPhoto:hover {
      transform: scale(1.06);
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-100vh); opacity: 0; }
    }

    .floatingText {
      position: fixed;
      font-size: 20px;
      color: #d63384;
      font-weight: 500;
      animation: floatUp 3s linear forwards;
      pointer-events: none;
    }

  </style>
</head>

<body>

<!-- 🌸 Glowing Dots -->
<div class="glow-container left"></div>
<div class="glow-container right"></div>

<div id="mainContent">

  <h1>I miss you Suzan.</h1>
  <p>I made this for you.</p>

  <button onclick="showMessage()">Click me</button>

  <p id="memory" style="display:none; margin-top:15px;">
    I think about you through every waking second of my days.
  </p>

  <p id="secret"></p>

  <img id="memoryPhoto" src="photo.jpg" style="display:none;">

  <br><br>

  <div id="nextPageContainer" style="display:none; margin-top:30px;">
    <a href="second.html" id="nextPageButton">
       One More Thing.
    </a>
  </div>

</div>

<audio id="bgMusic" src="song.mp3"></audio>

<script>
  let clickCount = 0;

  function showMessage() {
    const message = document.getElementById("secret");
    clickCount++;

    if (clickCount === 1) {
      message.innerHTML = "You are my favorite person in the world.";
    } 
    else if (clickCount === 2) {
      message.innerHTML = "You make even my worst days better.";
    } 
    else if (clickCount === 3) {
      message.innerHTML = "I genuinely don't know what I'd do without you.";
      document.getElementById("memory").style.display = "block";
    } 
    else if (clickCount === 4) {
      message.innerHTML = "Thank you for being you.";
      document.getElementById("memoryPhoto").style.display = "block";
      document.getElementById("nextPageContainer").style.display = "block";
    } 
    else {
      message.innerHTML = "Okay stop clicking before I fall even harder.";
    }

    message.style.opacity = 1;
    document.getElementById("bgMusic").play();

    for (let i = 0; i < 8; i++) {
      createHeart();
    }
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.innerHTML = "LOVE";
    heart.classList.add("floatingText");
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = "100vh";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 3000);
  }

  /* 🌸 Glowing Dot Generator */
  function createDot(side) {
    const container = document.querySelector(`.glow-container.${side}`);
    const dot = document.createElement("div");
    dot.classList.add("dot");

    const size = Math.random() * 6 + 4;
    dot.style.width = size + "px";
    dot.style.height = size + "px";
    dot.style.left = Math.random() * 120 + "px";

    const duration = Math.random() * 6 + 8;
    dot.style.animationDuration = duration + "s";

    container.appendChild(dot);
    setTimeout(() => dot.remove(), duration * 1000);
  }

  setInterval(() => createDot("left"), 1500);
  setInterval(() => createDot("right"), 1700);

</script>

</body>
</html>
